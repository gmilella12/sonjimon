<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sonjimon">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#222222">
  <title>Sonjimon</title>
  <style>
    /* --- colours:  --- */
    :root {
      --page:     #222;
      --shell:    #d8d4cc;
      --frame:    #555;
      --dpad:     #333;
      --dpad-txt: #777;
      --buttons:  #9a2257;
      --btn-txt:  #e8c8d8;
    }

    /* --- no web-page behaviour on touch --- */
    html, body { margin: 0; overscroll-behavior: none; }
    body, button, canvas {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    button, canvas { touch-action: none; }

    /* --- page --- */
    body {
      background: var(--page);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* --- shell --- */
    .gameboy {
      background: var(--shell);
      border-radius: 16px 16px 48px 16px;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      width: min(100vw, 600px);
      box-sizing: border-box;
    }

    /* on phones: fill the whole screen */
    @media (max-width: 500px) {
      .gameboy {
        min-height: 100dvh;
        border-radius: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
      }
    }

    /* --- screen --- */
    .screen {
      background: var(--frame);
      border-radius: 8px;
      padding: 12px;
      position: relative; /* lets the viewer sit on top of the canvas */
    }
    .screen canvas {
      display: block;
      width: 100%;
      image-rendering: pixelated;
      background: #000000;
    }

    /* photo viewer */
    .viewer {
      position: absolute;
      inset: 12px;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .viewer img {
      max-width: 100%;
      max-height: 85%;
      object-fit: contain;
    }
    #viewerCaption {
      color: #fff;
      font-family: sans-serif;
      font-size: 14px;
      text-align: center;
      padding: 0 8px;
    }

    #cinemaFrame {
      width: 100%;
      aspect-ratio: 16 / 9; /* video shape */
      border: none;
    }

    .hidden { display: none; }

    /* --- controls --- */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 28px;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      grid-template-areas:
        ".    up    ."
        "left .     right"
        ".    down  .";
    }
    .dpad .up    { grid-area: up; }
    .dpad .left  { grid-area: left; }
    .dpad .right { grid-area: right; }
    .dpad .down  { grid-area: down; }
    .dpad button {
      background: var(--dpad);
      color: var(--dpad-txt);
      border: none;
      border-radius: 6px;
      font-size: 18px;
    }

    .actions {
      display: flex;
      gap: 16px;
      transform: rotate(-25deg);
    }
    .actions button {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      background: var(--buttons);
      color: var(--btn-txt);
      font-size: 20px;
      font-weight: bold;
    }
    .actions .b { margin-top: 28px; }

    button:active { filter: brightness(0.8); }
  </style>
</head>
<body>
  <div class="gameboy">
    <div class="screen">
      <canvas id="screen" width="320" height="288"></canvas>
      <div id="viewer" class="viewer hidden">
        <img id="viewerImg" alt="">
        <div id="viewerCaption"></div>
      </div>
      <div id="cinema" class="viewer hidden">
        <iframe id="cinemaFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </div>
    </div>

    <div class="controls">
      <div class="dpad">
        <button id="up" class="up">▲</button>
        <button id="left" class="left">◀</button>
        <button id="right" class="right">▶</button>
        <button id="down" class="down">▼</button>
      </div>
      <div class="actions">
        <button id="Bag" class="b">B</button>
        <button id="Interaction" class="a">A</button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
