<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
  html, body {
    margin: 0;
    overscroll-behavior: none; /* no rubber-band bounce when swiping */
  }
  body, button, canvas {
    -webkit-user-select: none; /* no text selection (Safari) */
    user-select: none;
    -webkit-touch-callout: none; /* no long-press menu (iPhone) */
    -webkit-tap-highlight-color: transparent;  /* no grey flash on tap */
    touch-action: manipulation; /* no double-tap zoom */
  }
  button, canvas {
    touch-action: none; /* buttons and screen: no scrolling or zooming at all */
  }
</style>
</head>
<body style="background:#222; display:flex; flex-direction:column; align-items:center; justify-content:center;">
  <canvas id="screen" width="320" height="288" style="width:100%; max-width:640px; image-rendering:pixelated; background:#000000;"></canvas>
  <div>
    <button id="up">Up</button>
    <button id="down">Down</button>
    <button id="left">Left</button>
    <button id="right">Right</button>
  </div>
  <div>
    <button id="Interaction">Interaction</button>
    <button id="Bag">Bag</button>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
